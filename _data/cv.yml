    - title: Latency-Aware Speculative Decoding & Draft-Model Distillation
      year: Jan 2026 - Present
      description:
        - "Stack: Python, C++, PyTorch, Hugging Face, Qwen2.5/Qwen3, CUDA, Slurm, NVIDIA L4"
        - Implemented correct drafting, verification, rejection correction, bonus-token sampling, and KV caching with exact greedy equivalence.
        - Reduced 64 target passes to 22 verification passes and reached 2.91 tokens per target pass.
        - Profiled 0.79x–1.09x end-to-end performance versus greedy decoding and isolated the draft model as 62% of GPU time.
        - Improved cached greedy throughput from 92.96 to 102.06 tokens/s and compared Forward KL, Reverse KL, JS, and cross-entropy distillation objectives.
        - Improved acceptance by 5% on GSM8K and 4% on CNN/DailyMail in the best distillation experiments.

